<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7B1E" />
      <stop offset="35%" stop-color="#F5D77A" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7A5C10" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#000000" />
  <circle cx="50" cy="50" r="44" fill="url(#glowGrad)" />

  <!-- Outer gold hairline border with diamond nodes -->
  <rect x="5" y="5" width="90" height="90" rx="19" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="50" cy="5" r="2" fill="#F5D77A" />
  <circle cx="50" cy="95" r="2" fill="#F5D77A" />
  <circle cx="5" cy="50" r="2" fill="#F5D77A" />
  <circle cx="95" cy="50" r="2" fill="#F5D77A" />

  <!-- Stylized Serif 'D' Monogram with regenerative DNA/aesthetic flourish -->
  <g filter="url(#goldGlow)">
    <!-- Stem of D -->
    <path d="M30 22 H46 C60 22 71 31 71 50 C71 69 60 78 46 78 H30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />
    <!-- Inner cutout -->
    <path d="M42 34 H46 C54 34 59 40 59 50 C59 60 54 66 46 66 H42 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Vertical stem accent with serifs -->
    <path d="M26 22 H36 M26 78 H36 M31 22 V78" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="square" />
    <!-- Center diamond emblem -->
    <path d="M50 46 L53 50 L50 54 L47 50 Z" fill="#F5D77A" />
  </g>
</svg>